name: icongine
description: "An icon font generator for SVG and PNG assets. Generates TTF/OTF fonts and typed IconData APIs."
version: 1.2.0
homepage: https://github.com/g-turley/icongine
repository: https://github.com/g-turley/icongine
issue_tracker: https://github.com/g-turley/icongine/issues
topics:
  - icon
  - font
  - generator

executables:
  icongine: icongine

environment:
  sdk: ^3.11.0

dependencies:
  args: ^2.7.0
  dart_style: ^3.1.2
  image: ^4.5.4
  path: ^1.9.1
  xml: ^6.6.1
  yaml: ^3.1.3
  yaml_edit: ^2.2.4

dev_dependencies:
  lints: ^6.0.0
  test: ^1.26.3
