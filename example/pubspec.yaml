name: example
description: Demonstrates icongine with a responsive, searchable icon catalog.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  icongine:
    path: ../

flutter:
  uses-material-design: true
  fonts:
    - family: ExampleIcons
      fonts:
        - asset: assets/fonts/example_icons.otf

icongine:
  input_dir: assets/icons
  output_font: assets/fonts/example_icons.otf
  output_class: lib/generated/example_icons.dart
  name: ExampleIcons
  font_format: otf
  include_subdirs: true
  prefix_with_subdir: true
  normalize: false
  static_icon_provider: true
  generate_icon_map: true
